<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Админ-панель</title><style>body{font-family:Arial,sans-serif;margin:30px;background:#f7f7f8}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 4px 14px #0001}input,select,button{padding:9px;margin:4px;border:1px solid #ddd;border-radius:8px}button{background:#1f2937;color:#fff}table{width:100%;border-collapse:collapse;background:white}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left}</style></head>
<body><h1>Административная панель</h1><div class="card"><b>Тестовый вход:</b> admin / admin<br><input id="login" value="admin"><input id="password" type="password" value="admin"><button onclick="auth()">Войти</button></div>
<div class="card"><h2>Маршруты</h2><input id="newroute" placeholder="Новый маршрут"><button onclick="addRoute()">Добавить</button><div id="routes"></div></div>
<div class="card"><h2>Заявки</h2><button onclick="loadTasks()">Обновить</button><div id="tasks"></div></div>
<div class="card"><h2>Агенты</h2><button onclick="loadAgents()">Обновить</button><div id="agents"></div></div>
<script>
let token=''; async function auth(){let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:login.value,password:password.value})});let d=await r.json();token=d.access_token;loadRoutes();loadTasks();loadAgents();}
async function loadRoutes(){let r=await fetch('/api/routes');let data=await r.json();routes.innerHTML='<table><tr><th>ID</th><th>Описание</th></tr>'+data.map(x=>`<tr><td>${x.id}</td><td>${x.description}</td></tr>`).join('')+'</table>';}
async function addRoute(){await fetch('/api/admin/routes',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({description:newroute.value})});newroute.value='';loadRoutes();}
async function setPriority(id){let p=prompt('admin_priority'); if(p===null)return; await fetch('/api/admin/tasks/'+id+'/priority',{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({admin_priority:+p})});loadTasks();loadAgents();}
async function cancelTask(id){await fetch('/api/tasks/'+id,{method:'DELETE',headers:{'Authorization':'Bearer '+token}});loadTasks();loadAgents();}
async function abortAgent(id){await fetch('/api/admin/agents/'+id+'/abort',{method:'POST',headers:{'Authorization':'Bearer '+token}});loadTasks();loadAgents();}
async function loadTasks(){let r=await fetch('/api/admin/tasks',{headers:{'Authorization':'Bearer '+token}});let d=await r.json();tasks.innerHTML='<table><tr><th>ID</th><th>Маршрут</th><th>Пассажир</th><th>Статус</th><th>user/admin</th><th>Агент</th><th>Действия</th></tr>'+d.map(t=>`<tr><td>${t.id}</td><td>${t.route}</td><td>${t.passenger}</td><td>${t.status}</td><td>${t.user_priority}/${t.admin_priority}</td><td>${t.assigned_agent_id??''}</td><td><button onclick="setPriority(${t.id})">Приоритет</button><button onclick="cancelTask(${t.id})">Отменить</button></td></tr>`).join('')+'</table>';}
async function loadAgents(){let r=await fetch('/api/admin/agents',{headers:{'Authorization':'Bearer '+token}});let d=await r.json();agents.innerHTML='<table><tr><th>ID</th><th>Статус</th><th>Задача</th><th>Heartbeat</th><th></th></tr>'+d.map(a=>`<tr><td>${a.id}</td><td>${a.status}</td><td>${a.current_task_id??''}</td><td>${a.last_heartbeat}</td><td>${a.current_task_id?`<button onclick="abortAgent('${a.id}')">Abort</button>`:''}</td></tr>`).join('')+'</table>';}
setInterval(()=>{if(token){loadTasks();loadAgents();}},10000);
</script></body></html>
